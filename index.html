<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f8ff;--sf:#fff;--tx:#0e1a33;--mu:#7b8499;--ac:#1a5cf0;--ln:#e6ebf5;--me:#1a5cf0;--dg:#e5484d;--ip:#f3f6fb;--db:#fde8ea;--bga:#f5f8ffcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#0b1220;--sf:#141d30;--tx:#e8eefc;--mu:#8e9bb5;--ac:#4d8dff;--ln:#243049;--me:#2563eb;--ip:#1b2640;--db:#3a1d22;--bga:#0b1220cc}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.45 'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:auto;background:radial-gradient(circle at -8% -4%,#2f7bff40 0,#0000 32%),radial-gradient(circle at 108% 104%,#2f7bff55 0,#0000 36%),var(--bg);position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:2}
.bar h1{font-size:20px;flex:1;color:var(--tx)}
.bd{flex:1;overflow-y:auto}
.nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
.nav button{flex:1;padding:7px 0;border:0;background:0;color:var(--mu);font:inherit;font-size:12px;position:relative}
.nav button.on{color:var(--ac);font-weight:600}.nav span{display:block;font-size:20px}
input,textarea{font:inherit;color:var(--tx);background:var(--ip);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;width:100%}
.btn.o{background:0;color:var(--ac);border:1px solid var(--ac)}.btn.d{background:var(--db);color:var(--dg)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.row .f{flex:1;min-width:0}.mu,.row small{color:var(--mu);font-size:13px}
.row .f p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#3ddc6f;border:2px solid var(--sf)}
.bg{background:var(--ac);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;min-width:20px;text-align:center;display:inline-block}
.ol{display:flex;gap:14px;padding:12px 16px;overflow-x:auto}.ol div{text-align:center;font-size:12px;width:56px;flex:none}.ol .av{margin:0 auto 4px}
.fab{position:absolute;right:16px;bottom:78px;width:54px;height:54px;border-radius:18px;border:0;background:var(--ac);color:#fff;font-size:26px}
.ms{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:7px 11px;border-radius:16px;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:4px}
.m.th{align-self:flex-start;background:var(--ip);border:1px solid var(--ln);border-bottom-left-radius:4px}
.m small{display:block;text-align:right;font-size:11px;opacity:.85}
.m img,.m video{max-width:100%;border-radius:10px;display:block}
.rq{border-left:3px solid #9be0b1;padding:2px 8px;margin-bottom:4px;font-size:13px;opacity:.85}
.k2{color:#8fd3ff}
.ib{display:flex;gap:4px;padding:8px;background:var(--sf);border-top:1px solid var(--ln);align-items:center}
.ib button,.ic{border:0;background:0;font-size:22px;padding:4px 6px;color:var(--tx)}
.vp{cursor:pointer}.vb{display:inline-block;width:80px;height:4px;background:#8885;border-radius:2px;vertical-align:middle;margin:0 6px}.vb u{display:block;height:100%;width:0;background:currentColor;border-radius:2px}
.ov{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--sf);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px;display:grid;gap:10px;max-height:85%;overflow:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#10203f;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}#toast.s{opacity:1}
.sw{width:44px;height:26px;border-radius:13px;background:var(--ln);position:relative;flex:none;transition:.2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--ac)}.sw.on::after{left:21px}
.sp{display:flex;flex-direction:column;height:100%;text-align:center;color:#fff;background:linear-gradient(170deg,#2f7dff 0%,#1a5cf0 55%,#0b3fd6 100%)}
@keyframes u{from{transform:scale(.3) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}.lg{animation:u .9s cubic-bezier(.2,.9,.3,1.2)}
@media(prefers-reduced-motion:reduce){.lg{animation:none}}
.pd{padding:14px 16px;display:grid;gap:10px}
.tb{display:flex;gap:6px}.tb button{flex:1;padding:9px;border-radius:12px;border:0;background:var(--ip);color:var(--tx);font:inherit}.tb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}.st div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;text-align:center}.st b{display:block;font-size:26px;color:var(--ac)}
.em{text-align:center;color:var(--mu);padding:30px 16px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px}
details{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.seg{display:flex;background:var(--ip);border-radius:14px;padding:4px}.seg button{flex:1;border:0;background:0;padding:10px;border-radius:11px;font:inherit;font-weight:600;color:var(--tx)}.seg button.on{background:var(--ac);color:#fff}
.fld{position:relative}.fld>span{position:absolute;left:13px;top:50%;transform:translateY(-50%)}.fld input{padding-left:42px;padding-top:13px;padding-bottom:13px}
.btn{padding:13px 16px;border-radius:14px}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.ring{display:inline-block;padding:2px;border-radius:50%;background:linear-gradient(135deg,#1459f0,#6aa5ff);margin:0 auto 4px}.ring .av{margin:0;border:2px solid var(--sf);box-sizing:content-box;width:48px;height:48px}
.send{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff!important;font-size:18px!important;padding:0!important}
.or{display:flex;align-items:center;gap:10px;color:var(--mu)}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spn{width:34px;height:34px;border:3px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:r 1s linear infinite;margin:auto}@keyframes r{to{transform:rotate(360deg)}}
html,body{overflow:hidden;overscroll-behavior:none}
.bar{background:var(--bga);border-bottom:0;backdrop-filter:blur(8px)}.bar h1{font-size:22px;font-weight:700}
.row{margin:8px 14px;border-radius:22px;border:1px solid var(--ln);box-shadow:0 4px 14px #0a4df012}
.btn{border-radius:30px;background:linear-gradient(90deg,#1a8cff,#0a3df0);box-shadow:0 8px 20px #0a3df044}.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--ln);box-shadow:0 4px 14px #0a3df01a}.btn.d{background:var(--db);color:var(--dg);box-shadow:none}
.seg{border-radius:30px}.seg button{border-radius:26px}.fld input{border-radius:30px;background:var(--sf);box-shadow:0 4px 14px #0a3df01a}
.nav{border-radius:24px 24px 0 0;box-shadow:0 -4px 20px #0a4df01a;border:0}.nav button.on::after{content:"";position:absolute;bottom:1px;left:22%;right:22%;height:3px;border-radius:2px;background:var(--ac)}
.pc{padding:14px}.pc h3{font-size:20px}.ico2{width:34px;font-size:24px;text-align:center;flex:none}.chev{color:var(--ac);font-size:26px;font-weight:700;line-height:1}
.cd{background:var(--sf);margin:10px 14px;border-radius:22px;border:1px solid var(--ln);box-shadow:0 4px 14px #0a4df012;overflow:hidden}
.pr{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--ln)}.pr:last-child{border:0}.pr .f{flex:1;min-width:0}

 return `<div class="bd">${b}</div>${S.tab=='chats'&&!S.sub?'<button class="fab" onclick="newMsg()">✎</button>':''}<div class="nav">${[['chats','💬',t('চ্যাট','Chats')],['fr','👥',t('বন্ধু','Friends')],['ca','📞',t('কল','Calls')],['me','👤',t('প্রোফাইল','Profile')]].map(x=>`<button class="${S.tab==x[0]||(x[0]=='me'&&(S.tab=='st'||S.tab=='pr'))?'on':''}" onclick="S.tab='${x[0]}';S.sub='';render()"><span>${x[1]}</span>${x[2]}${x[0]=='chats'&&u?`<b class="bg" style="position:absolute;top:2px;margin-left:8px">${u}</b>`:''}</button>`).join('')}</div>`}

return `<div class="bar"><button class="ic" onclick="menu2()">☰</button><h1 style="text-align:center">${t('চ্যাট','Chats')}</h1><button class="ic" onclick="S.sh=!S.sh;render()">🔍</button></div>${S.sh?`<div class="pd" style="padding-bottom:0"><input placeholder="চ্যাট খুঁজুন" value="${E(S.q)}" oninput="S.q=this.value;$('#list').innerHTML=rows()"></div>`:''}${S.notice?`<div class="row" style="background:var(--ip)">📢 ${E(S.notice)}</div>`:''}<div class="ol"><div onclick="addSt()"><div class="av" style="width:58px;height:58px;font-size:30px;background:var(--ac);margin:0 auto 4px">+</div>স্টোরি</div><i style="width:1px;background:var(--ln);align-self:stretch"></i>${S.me.story?`<div onclick="viewSt()"><div class="ring"><div class="av" style="${S.me.storyT=='vid'?'background:#10203f;color:#fff':`background:url(${S.me.story}) center/cover`}">${S.me.storyT=='vid'?'▶':''}</div></div>আমার</div>`:''}${o.map(c=>`<div onclick="openChat('${c.id}')"><div class="ring">${av(c)}</div>${E(c.name.split(' ')[0])}</div>`).join('')||'<div class="ring"><div class="av" style="background:var(--ip)"></div></div>'.repeat(3)}</div><div id="list">${rows()}</div>`}
const upV=()=>`<div class="bar"><h1>${t('আপডেট','Updates')}</h1></div><div class="row" onclick="${S.me.story?'viewSt()':'addSt()'}">${avMe(46)}<div class="f"><b>আমার স্টোরি</b><p class="mu">${S.me.story?'দেখতে চাপুন':'স্টোরি যোগ করতে চাপুন'}</p></div></div><p class="pd mu">সক্রিয় বন্ধু</p>${fr().filter(c=>c.online&&!c.group).map(c=>`<div class="row" onclick="openChat('${c.id}')">${av(c)}<div class="f"><b>${E(c.name)}</b><p class="mu">${E(c.bio||'অনলাইন')}</p></div></div>`).join('')||'<p class="em">কেউ অনলাইনে নেই</p>'}`;
function menu2(){sheet(`<button class="btn o" onclick="closeS();grp()">👥 নতুন গ্রুপ</button><button class="btn o" onclick="closeS();S.tab='st';render()">⚙️ সেটিংস</button><button class="btn d" onclick="out()">লগআউট</button>`)}
function addSt(){$('#fs').click()}
function stPick(e){const f=e.files[0];e.value='';if(!f)return;const m=S.me;
 if(f.type.startsWith('video')){if(f.size>25e6)return toast('ভিডিও ২৫ MB-র বেশি, ছোট ভিডিও দিন');m.story=URL.createObjectURL(f);m.storyT='vid';idb('put','story_'+m.id,f);render();toast('ভিডিও স্টোরি যোগ হয়েছে')}
 else toData(f,800,u=>{m.story=u;m.storyT='img';idb('del','story_'+m.id);render();toast('স্টোরি যোগ হয়েছে')})}
function viewSt(){const m=S.me;sheet(`${m.storyT=='vid'?`<video src="${m.story}" controls autoplay playsinline style="width:100%;border-radius:14px"></video>`:`<img src="${m.story}" style="width:100%;border-radius:14px">`}<button class="btn o" onclick="S.me.story='';S.me.storyT='';idb('del','story_'+S.me.id);closeS();render()">স্টোরি মুছুন</button>`)}
function grp(){S.gm=[];sheet(`<b>নতুন গ্রুপ</b><input id="gn" placeholder="গ্রুপের নাম"><b style="font-size:14px">সদস্য যোগ করুন</b>${fr().filter(c=>!c.group).map(c=>`<div class="row" onclick="gt('${c.id}',this)">${av(c)}<div class="f">${E(c.name)}</div><span style="color:var(--ac);font-weight:700"></span></div>`).join('')}<button class="btn" onclick="mkG()">গ্রুপ তৈরি করুন</button>`)}
function gt(id,e){const i=S.gm.indexOf(id);if(i<0){S.gm.push(id);e.lastChild.textContent='✓'}else{S.gm.splice(i,1);e.lastChild.textContent=''}}
function mkG(){const n=$('#gn').value.trim();if(!n)return toast('গ্রুপের নাম লিখুন');if(S.gm.length<2)return toast('কমপক্ষে ২ জন সদস্য বাছুন');const g={id:'G'+Date.now(),name:n,group:1,friend:1,online:0,blocked:0,banned:0,unread:0,last:'এখন',bio:'',mem:S.gm.map(i=>C.find(c=>c.id==i).name.split(' ')[0]),msgs:[]};C.unshift(g);closeS();openChat(g.id)}
function newMsg(){sheet(`<b>নতুন মেসেজ</b>${fr().map(c=>`<div class="row" onclick="closeS();openChat('${c.id}')">${av(c)}<div class="f">${E(c.name)}</div></div>`).join('')||'<p class="em">আগে বন্ধু যুক্ত করুন</p>'}`)}
const frRows=()=>{const q=S.fq.trim().toLowerCase(),src=q?C.filter(c=>!c.group&&!c.banned&&(c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))):C.filter(c=>c.friend&&!c.banned&&!c.group);
 return src.length?src.map(c=>`<div class="row">${av(c)}<div class="f"><b>${E(c.name)}</b><p class="mu">${c.id}</p></div>${c.blocked?`<button class="chip" onclick="blk('${c.id}',0)">আনব্লক</button>`:c.friend?`<button class="chip" onclick="openChat('${c.id}')">চ্যাট</button><button class="chip" onclick="blk('${c.id}',1)">ব্লক</button>`:`<button class="chip" onclick="addF('${c.id}')">যুক্ত করুন</button>`}</div>`).join(''):'<p class="em">কাউকে পাওয়া যায়নি</p>'};
function frV(){return `<div class="bar"><h1>${t('বন্ধু','Friends')} (${C.filter(c=>c.friend&&!c.banned&&!c.group).length})</h1></div><div class="pd"><input placeholder="🔍 নাম বা ইউজার আইডি (FC...)" value="${E(S.fq)}" oninput="S.fq=this.value;$('#fl').innerHTML=frRows()"><div class="tb"><button onclick="qrs()">আমার QR</button><button onclick="scan()">QR স্ক্যান</button></div><button class="btn o" onclick="shr()">📤 অ্যাপ বন্ধুদের শেয়ার করুন</button></div><div id="fl">${frRows()}</div>`}
function addF(id){const c=C.find(x=>x.id==id);c.friend=1;toast(c.name+' বন্ধু হয়েছেন');render()}
function blk(id,v){const c=C.find(x=>x.id==id);c.blocked=v;toast(c.name+(v?' ব্লক হয়েছে':' আনব্লক হয়েছে'));render()}
const qr=id=>{try{const q=qrcode(0,'M');q.addData('HKA:'+id);q.make();return `<img src="${q.createDataURL(6,2)}" style="width:100%;image-rendering:pixelated;display:block">`}catch(e){return '<p class="em">QR তৈরি হয়নি</p>'}};
function qrs(){sheet(`<b style="text-align:center">${E(S.me.name)}</b><div style="background:#fff;border-radius:12px;padding:10px;width:230px;margin:auto">${qr(S.me.id)}</div><p class="mu" style="text-align:center">${S.me.id}<br>অন্য ফোন থেকে এই QR স্ক্যান করলে বন্ধু যুক্ত হবে</p>`)}
let SC={};
function stopCam(){clearInterval(SC.iv);if(SC.st)SC.st.getTracks().forEach(t=>t.stop());SC.st=0}
function scan(){sheet(`<b>QR স্ক্যান</b><video id="cv" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:1;object-fit:cover"></video><button class="btn o" onclick="$('#fq').click()">📷 ছবি তুলে / গ্যালারি থেকে স্ক্যান</button>`);startCam()}
async function startCam(){try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});SC.st=st;const v=$('#cv');if(!v){stopCam();return}v.srcObject=st;await v.play();const cv=document.createElement('canvas'),x=cv.getContext('2d',{willReadFrequently:true});SC.iv=setInterval(()=>{if(!v.videoWidth||!window.jsQR)return;cv.width=v.videoWidth;cv.height=v.videoHeight;x.drawImage(v,0,0);const d=x.getImageData(0,0,cv.width,cv.height),r=jsQR(d.data,d.width,d.height);if(r&&r.data)got(r.data)},250)}catch(e){toast('ক্যামেরা চালু হয়নি। নিচের বাটন দিয়ে ছবি তুলে স্ক্যান করুন')}}
function scanImg(e){const f=e.files[0];e.value='';if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);const r=window.jsQR&&jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r){SC.img=1;got(r.data)}else toast('ছবিতে QR পাওয়া যায়নি')};im.src=URL.createObjectURL(f)}
function got(d){if(!SC.st&&!SC.img)return;SC.img=0;closeS();const m=/^HKA:(FC\d+)$/.exec(d||'');if(!m)return toast('এটি HKA Messenger এর QR নয়');const id=m[1];if(id==S.me.id)return toast('এটা আপনার নিজের QR');let c=C.find(x=>x.id==id);if(!c){c={id,name:'HKA ইউজার '+id.slice(-4),bio:'',online:1,friend:0,blocked:0,banned:0,unread:0,last:'নতুন',msgs:[]};C.push(c)}if(c.friend)return toast(c.name+' আগে থেকেই বন্ধু');c.friend=1;render();toast('QR স্ক্যান সফল: '+c.name+' যুক্ত হয়েছেন')}

<div class="row"><span>📞</span><div class="f">${E(m.phone||'মোবাইল নম্বর নেই')}</div></div><div class="row"><span>✉️</span><div class="f">${E(m.email||'ইমেইল নেই')}</div></div><div class="row"><span>🪪</span><div class="f">ID: ${m.id}</div><button class="chip" onclick="copyT('${m.id}')">কপি</button></div><div class="row" onclick="ed()"><span>💭</span><div class="f">${E(m.bio)}</div><span class="mu">✎</span></div><div class="row"><span>🕒</span><div class="f">শেষ দেখা: ${m.status?'এখন':E(m.seen)}</div></div><div class="pd"><button class="btn" onclick="ed()">প্রোফাইল এডিট</button><button class="btn o" onclick="qrs()">আমার QR কোড</button></div>`}

function cancelRec(){clearInterval(S.iv);if(S.rec&&S.mr){S.mr.onstop=null;try{S.mr.stop()}catch(e){}if(S.st)S.st.getTracks().forEach(t=>t.stop())}S.rec=0;closeS()}
function pick(e,ty){const f=e.files[0];e.value='';if(!f)return;if(ty!='file')ty=f.type.startsWith('video')?'vid':'img';if(ty=='img')toData(f,900,u=>addM({t:'img',c:u}));else addM({t:ty,c:ty=='file'?f.name:URL.createObjectURL(f)})}
function menu(id){const m=S.cur.msgs.find(x=>x.id==id);sheet(`<button class="btn o" onclick="rpl(${id})">↩ রিপ্লাই</button>${m.t=='text'?`<button class="btn o" onclick="closeS();copyT(S.cur.msgs.find(x=>x.id==${id}).c)">📋 কপি</button>`:''}${m.t=='text'?`<button class="btn o" onclick="svM(${id})">🔖 সেভ করুন</button>`:''}<button class="btn d" onclick="del(${id})">🗑 ডিলিট</button>`)}
function rpl(id){S.reply=mt(S.cur.msgs.find(x=>x.id==id)).slice(0,60);closeS();drawM();$('#inp').focus()}
function del(id){S.cur.msgs=S.cur.msgs.filter(x=>x.id!=id);closeS();drawM();toast('মেসেজ ডিলিট হয়েছে')}
function cm(){const c=S.cur;sheet(`<b>${E(c.name)}</b><button class="btn o" onclick="rep()">🚩 রিপোর্ট করুন</button><button class="btn o" onclick="blk('${c.id}',1);closeS();back()">🚫 ব্লক করুন</button><button class="btn o" onclick="S.cur.msgs=[];closeS();drawM()">🧹 চ্যাট মুছুন</button>`)}
function rep(){sheet(`<b>রিপোর্টের কারণ</b>${['স্প্যাম','অশালীন আচরণ','ভুয়া অ্যাকাউন্ট'].map(w=>`<button class="btn o" onclick="doRep('${w}')">${w}</button>`).join('')}`)}
function doRep(w){const c=S.cur;S.R.push({id:rid++,uid:c.id,name:c.name,why:w,st:'open'});closeS();toast('রিপোর্ট পাঠানো হয়েছে')}

/* ---------- admin ---------- */
const bmsg=a=>'এই অ্যাকাউন্ট '+(a.until?new Date(a.until).toLocaleString('bn-BD')+' পর্যন্ত বন্ধ':'স্থায়ীভাবে বন্ধ');
function chk(){let c=0;[...A,...C].forEach(x=>{if(x.banned&&x.until&&x.until<Date.now()){x.banned=0;x.until=0;c=1}});return c}
function adm(){if(S.adOK)return openAd();sheet(`<b>🔐 অ্যাডমিন যাচাই</b><input id="ap" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড"><button class="btn" onclick="adPw()">আনলক</button>${S.cred?'<button class="btn o" onclick="bioGo()">👆 ফিঙ্গারপ্রিন্ট / ফেস লক</button>':''}<small class="mu">প্রথমবারের পাসওয়ার্ড: admin123 (প্যানেলে গিয়ে বদলে নিন)</small>`)}
function adPw(){if($('#ap').value!==S.adPw)return toast('ভুল পাসওয়ার্ড');unlockAd()}
function unlockAd(){S.adOK=1;closeS();openAd()}
function openAd(){S.scr='admin';render()}
function lockAd(){S.adOK=0;S.scr='main';S.tab='st';render()}
async function bioReg(){try{const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'HKA Messenger'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'admin',displayName:'Admin'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});S.cred=btoa(String.fromCharCode(...new Uint8Array(cr.rawId)));try{localStorage.setItem('hka_cred',S.cred)}catch(e){}toast('ফিঙ্গারপ্রিন্ট/ফেস লক চালু হয়েছে');render()}catch(e){toast('এই ব্রাউজারে চালু করা যায়নি। লিংকটি সরাসরি Chrome-এ খুলুন')}}
async function bioGo(){try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:Uint8Array.from(atob(S.cred),c=>c.charCodeAt(0))}],userVerification:'required',timeout:60000}});unlockAd()}catch(e){toast('যাচাই হয়নি, পাসওয়ার্ড ব্যবহার করুন')}}
function setAp(){const v=$('#np').value;if(v.length<6)return toast('কমপক্ষে ৬ অক্ষর দিন');S.adPw=v;try{localStorage.setItem('hka_adpw',v)}catch(e){}$('#np').value='';toast('অ্যাডমিন পাসওয়ার্ড বদলেছে')}
function adminV(){chk();const U=[...A.map(a=>({id:a.id,name:a.name,b:a.banned,u:a.until,adm:a.admin})),...C.filter(c=>!c.group).map(c=>({id:c.id,name:c.name,b:c.banned,u:c.until}))],st=x=>x.b?'⛔ বন্ধ ('+(x.u?new Date(x.u).toLocaleString('bn-BD')+' পর্যন্ত':'স্থায়ী')+')':'✅ সক্রিয়';
return `<div class="bar"><button class="ic" onclick="lockAd()">‹</button><h1>অ্যাডমিন প্যানেল</h1><button class="chip" onclick="lockAd()">🔒 লক</button></div><div class="bd"><div class="st"><div><b>${U.length}</b>মোট ব্যবহারকারী</div><div><b>${A.filter(a=>a.nw).length}</b>নতুন ব্যবহারকারী</div><div><b>${U.filter(x=>x.b).length}</b>বন্ধ অ্যাকাউন্ট</div><div><b>${S.R.filter(r=>r.st=='open').length}</b>খোলা রিপোর্ট</div></div>
<div class="cd"><div class="pr" onclick="S.regOff=S.regOff?0:1;render()"><div class="f">নতুন রেজিস্ট্রেশন বন্ধ রাখুন</div><i class="sw ${S.regOff?'on':''}"></i></div><div class="pr"><input id="nt" placeholder="সবার জন্য ঘোষণা" value="${E(S.notice||'')}"><button class="chip" onclick="S.notice=$('#nt').value.trim();toast('ঘোষণা সেভ হয়েছে')">সেভ</button></div></div>
<div class="cd"><div class="pr"><input id="np" type="password" placeholder="নতুন অ্যাডমিন পাসওয়ার্ড"><button class="chip" onclick="setAp()">বদলান</button></div><div class="pr" onclick="bioReg()"><span class="ico2">👆</span><div class="f">ফিঙ্গারপ্রিন্ট / ফেস লক ${S.cred?'(চালু ✓)':'চালু করুন'}</div><span class="chev">›</span></div></div>
<p class="pd"><b>রিপোর্ট</b></p>${S.R.map(r=>`<div class="row"><div class="f"><b>${E(r.name)}</b><p class="mu">${E(r.why)} · ${r.st=='open'?'খোলা':'নিষ্পন্ন'}</p></div>${r.st=='open'?`<button class="chip" onclick="askS('${r.uid}',${r.id})">সাময়িক বন্ধ</button><button class="chip" onclick="dis(${r.id})">খারিজ</button>`:''}</div>`).join('')||'<p class="em">কোনো রিপোর্ট নেই</p>'}
<p class="pd"><b>ব্যবহারকারী</b></p>${U.map(x=>`<div class="row"><div class="f"><b>${E(x.name)}</b><p class="mu">${st(x)}</p></div>${x.adm?'':`<button class="chip" onclick="${x.b?`unS('${x.id}')`:`askS('${x.id}')`}">${x.b?'সক্রিয় করুন':'সাময়িক বন্ধ'}</button>`}</div>`).join('')}</div>`}
function askS(id,r){sheet(`<b>কতক্ষণের জন্য বন্ধ করবেন?</b>${[['১ ঘণ্টা',36e5],['৬ ঘণ্টা',216e5],['২৪ ঘণ্টা',864e5],['৭ দিন',6048e5],['স্থায়ী',0]].map(d=>`<button class="btn o" onclick="doS('${id}',${d[1]},${r||0})">${d[0]}</button>`).join('')}`)}
function doS(id,ms,r){const x=A.find(a=>a.id==id)||C.find(c=>c.id==id);if(!x)return;if(x.admin)return toast('অ্যাডমিনকে বন্ধ করা যায় না');x.banned=1;x.until=ms?Date.now()+ms:0;if(r)S.R.find(z=>z.id==r).st='done';closeS();toast('অ্যাকাউন্ট বন্ধ করা হয়েছে');render()}
function unS(id){const x=A.find(a=>a.id==id)||C.find(c=>c.id==id);x.banned=0;x.until=0;toast('অ্যাকাউন্ট সক্রিয় করা হয়েছে');render()}
function dis(id){S.R.find(z=>z.id==id).st='done';render()}
function fitVV(){const v=window.visualViewport;if(!v)return;$('#app').style.height=v.height+'px';window.scrollTo(0,0);const m=$('#msgs');if(m&&S.scr=='chat')m.scrollTop=m.scrollHeight}
if(window.visualViewport){visualViewport.addEventListener('resize',fitVV);visualViewport.addEventListener('scroll',fitVV)}
try{S.cred=localStorage.getItem('hka_cred')||'';S.adPw=localStorage.getItem('hka_adpw')||'admin123'}catch(e){}

const idb=(m,k,v)=>new Promise(res=>{try{const r=indexedDB.open('hka',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{const t=r.result.transaction('f',m=='get'?'readonly':'readwrite'),o=t.objectStore('f'),q=m=='get'?o.get(k):m=='put'?o.put(v,k):o.delete(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)};r.onerror=()=>res(null)}catch(e){res(null)}});
const LS='hka_state_v1';
function toData(f,mx,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
function snap(img){return JSON.stringify({A:A.map(a=>a.storyT=='vid'?{...a,story:''}:a),C:C.map(c=>({...c,typing:0,msgs:c.msgs.filter(m=>m.t=='text'||m.t=='file'||(img&&m.t=='img'))})),me:S.me&&S.me.id,saved:S.saved,R:S.R,set:S.set,lang:S.lang,regOff:S.regOff,notice:S.notice,share:S.shareLink,rid,uid})}
function save(){try{localStorage.setItem(LS,snap(1))}catch(e){try{localStorage.setItem(LS,snap(0))}catch(e2){}}}
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(!d||!d.A)return;A=d.A;C=d.C;S.saved=d.saved||[];S.R=d.R||S.R;S.set=d.set||S.set;S.lang=d.lang||'bn';S.regOff=d.regOff;S.notice=d.notice;S.shareLink=d.share||'';rid=d.rid||rid;uid=d.uid||uid;const a=d.me&&A.find(x=>x.id==d.me);if(a&&!a.banned){a.status=1;S.me=S.acct=a;if(a.storyT=='vid')idb('get','story_'+a.id).then(b=>{if(b){a.story=URL.createObjectURL(b);render()}})}}catch(e){}}
load();
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
render();setTimeout(()=>{if(S.scr=='splash'){S.scr=S.me?'main':'auth';render()}},2200);
</script></body></html>
